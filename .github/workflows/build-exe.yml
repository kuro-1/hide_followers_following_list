name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'gui_hide_lists.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Executable
        run: pyinstaller --onefile --windowed --name "InstagramHideLists" gui_hide_lists.py

      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Instagram Hide Lists (Windows GUI)"
          files: dist/InstagramHideLists.exe
